; PlatformIO Project Configuration File — TV IR IN ONE (DSTV IR in → IR LED out, one board)
;
; Board: WEMOS LOLIN S2 Mini (ESP32-S2, 240 MHz, 4 MB Flash, 2 MB PSRAM)
; Partition scheme: Custom OTA (2 × 1.5 MB App / 960 KB SPIFFS)
;
; FIRST flash must be over USB:   pio run -e usb -t upload
;   (hold button 0, tap RST, release 0 to enter download mode on the S2 Mini)
; After that over WiFi (OTA):
;   pio run -e ota -t upload --upload-port <board ip>
;   (your own targets: private.ini, see private.example.ini)
; Or from any browser (no PlatformIO needed): build (pio run), then upload
;   firmware_out/TV_IR_IN_ONE_v<version>.bin on http://<board ip>/update
;   (the board's owner password)
; Network upload (pio ... -t upload) also needs the owner password: set it on
; your PC as environment variable IR_OTA_PASS (see upload_flags below).

[platformio]
default_envs = usb
extra_configs = private.ini     ; your own upload targets (not committed, see private.example.ini)

; ── Shared build settings ─────────────────────────────────────────────────────
[env]
platform = espressif32@6.6.0
board = lolin_s2_mini
framework = arduino
board_build.partitions = partitions_ota.csv
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
extra_scripts =
    pre:tools/touch_about.py   ; About page Build Date = real build time
    post:tools/export_bin.py   ; firmware_out/TV_IR_IN_ONE_v<ver>.bin for the /update page

lib_deps =
    mathieucarbou/AsyncTCP @ ^3.2.14
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    bblanchon/ArduinoJson @ ^6.21.5
    crankyoldgit/IRremoteESP8266 @ 2.8.6

; ── USB upload (direct cable) ─────────────────────────────────────────────────
[env:usb]
upload_protocol = esptool
upload_speed = 921600
upload_flags =
    --after
    no_reset

; ── OTA upload (over Wi-Fi) ───────────────────────────────────────────────────
[ota]
upload_protocol = espota
upload_flags =
    --timeout=60                    ; ESP32-S2 single core: flash writes stall OTA ACKs
    --auth=${sysenv.IR_OTA_PASS}    ; owner password of the board (set IR_OTA_PASS on your PC)

[env:ota]
extends = ota            ; pio run -e ota -t upload --upload-port <board ip>
