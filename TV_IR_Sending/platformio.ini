; PlatformIO Project Configuration File — TV IR TX (DSTV IR → ESP-NOW sender)
;
; Board: WEMOS LOLIN S2 Mini (ESP32-S2, 240 MHz, 4 MB Flash, 2 MB PSRAM)
; Partition scheme: Custom OTA (2 × 1.5 MB App / 960 KB SPIFFS)
;
; One firmware for every TX board. WiFi, IP and host name are in the board's
; /WifiSettings.json (setup portal "IR-FORWARD-TX-xxxx" when it is missing).
;
; Update over WiFi (OTA) — any board, by its IP:
;   pio run -t upload --upload-port <board ip>
; FIRST flash of a new board over USB:
;   pio run -e usb -t upload

[platformio]
default_envs = ota
extra_configs = private.ini     ; your own upload targets (not committed, see private.example.ini)

; ── Shared build settings ─────────────────────────────────────────────────────
[env]
platform = espressif32@6.6.0
board = lolin_s2_mini
framework = arduino
board_build.partitions = partitions_ota.csv
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
extra_scripts =
    pre:tools/touch_about.py   ; About page Build Date = real build time
    post:tools/export_bin.py   ; firmware_out/: <project>_v<ver>.bin + _full.bin (browser flash)

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    mathieucarbou/AsyncTCP @ ^3.2.14
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    hunamizawa/ESPPerfectTime @ ^0.3.0
    openenergymonitor/EmonLib @ ^1.1.0
    crankyoldgit/IRremoteESP8266 @ 2.8.6

; ── Upload methods ────────────────────────────────────────────────────────────
[usb]
upload_protocol = esptool
upload_speed = 921600
upload_flags =
    --after
    no_reset

[ota]
upload_protocol = espota
upload_flags =
    --timeout=60                    ; ESP32-S2 single core: flash writes stall OTA ACKs
    --auth=${sysenv.IR_OTA_PASS}    ; owner password of the board (set IR_OTA_PASS on your PC)

; ── OTA (default) — pass the board with --upload-port <ip> ───────────────────
[env:ota]
extends = ota

; ── USB (first flash of a new board) ─────────────────────────────────────────
[env:usb]
extends = usb
